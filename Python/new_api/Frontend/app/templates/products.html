{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Products</h1>
        <a href="{{ url_for('product_bp.add_product') }}" class="btn btn-success">+ Add New Product</a>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for p in products %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                <img src="{{ p.image }}" class="card-img-top" alt="{{ p.name }}">
                <div class="card-body">
                    <h5 class="card-title">{{ p.name }}</h5>
                    <p class="card-text">{{ p.desc }}</p>
                    <p class="card-text"><strong>Price:</strong> ${{ p.price }}</p>
                    <p class="card-text"><strong>Status:</strong> {{ p.status }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
        {% if products|length == 0 %}
        <p class="mt-3">No products found.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
